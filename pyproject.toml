[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dgsn"
version = "0.1.0"
description = "Differential-geometric model of Type Ia supernova multi-band light curves"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "cmdstanpy>=1.2",
]

[project.optional-dependencies]
# ztfcosmo is the maintained ZTF SN Ia DR2 interface. It works with no
# credentials, reading remotely from ztfcosmo.in2p3.fr; set $ZTFCOSMODIR to
# use a local copy of the archive instead.
data = ["ztfcosmo"]
# SALT2 and Hsiao templates: the starting point of the fit and the stage-2
# global functions (model-definition.tex Section 5), and the floors of
# Section 3.  Initialization is exempt from the rule that SALT2 stays
# downstream; nothing here is fit to.
salt = ["sncosmo>=2.10"]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
